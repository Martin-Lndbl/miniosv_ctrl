name = "anyblob"
title = "AnyBlob against S3 on a 200 Gbps wire: payload throughput vs provisioned cores"
description = """
The AnyBlob arm of the S3 bandwidth figure (Durner, Leis, Neumann, VLDB 2023):
a download manager built for object storage -- io_uring, shared submission
queue, one daemon per core -- so the per-core claim is not made against `wrk`
alone. It belongs on this figure more than on the nginx one: its
throughput-based resolver only has anything to do when the peer is S3.

The nginx arm's configuration, endpoint aside: core budget on the axis, 64
requests a core, 32 MiB ranged GETs, 256 blocks a worker, plain HTTP, `nogro`
with the MTU left at 9001. `gro_off` and `cap_cores` are the shared prelude's,
so both Linux arms are confined by one piece of code.

**`pin = 0`, deliberately.** The nginx arm dials one private address and is
pinned by construction; S3 is not one server, and pinning it through /etc/hosts
disables the contribution AnyBlob is known for. It also matches the miniOSv
arm, which resolves per worker.

The budget still holds unpinned, and that is measured rather than assumed:
`CPU BUDGET: cores_out=..` from /proc/stat never exceeded 0.04 across 11 runs.
Read `cores_in` as proof of confinement only -- it spans the whole process
including buffer-pool allocation, where the binary's `cores_avg` spans the
transfer alone.
"""

bench    = "competitors/anyblob"
instance = "r6in.32xlarge"
axis     = "cpus"
grid     = { cpus = [2, 4, 8, 16, 32] }
reps     = 2
cooldown = 0
max_vm_seconds = 900

value_col = "gbps_wire_steady"
ylabel    = "Gbps (frames, every slot busy)"
unit      = "Gbps"
series    = "note"

[fixed]
conns  = 64
block  = "32M"
blocks = 256
scheme = "http"
mode   = "nogro"
pin    = 0

[env]
AWS_BUCKET_SIZE = "50G"
BENCH_NOTE      = "AnyBlob"
BENCH_ZONE      = "eu-north-1b"
