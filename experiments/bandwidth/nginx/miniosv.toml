name = "miniosv"
title = "miniOSv against a static nginx: throughput against workers, ranges from a shared pool"
description = """
The unikernel arm of the bandwidth figure. Payload throughput against the core
budget, fetching from a static nginx we control on a second r6in.32xlarge in
the same availability zone, over its private address -- no object store in the
way, so the client is the only subject.

32 MiB ranged GETs, plain HTTP, `Connection: close` (one block a connection),
64 connections a worker, blocks drawn from a shared pool so a slow worker
fetches fewer rather than holding the run open. A worker owns a core.

A `server` type launches an nginx per point, which is what makes
`just reproduce` work alone. For a sweep use a long-living one instead:

    scripts/bench/nginx-server.py start --client r6in.32xlarge
    BENCH_ZONE=<its zone> just reproduce <this> --target-ip <its ip>

with `server` set to "" so the point does not launch its own.
"""

bench    = "apps/bench/smoltcp-s3"
instance = "r6in.32xlarge"
axis     = "workers"
grid     = { workers = [2, 4, 8, 16, 32] }
reps     = 2
cooldown = 0
max_vm_seconds = 900

[fixed]
conns  = 64
blocks = 256
block  = "32M"
# A type here launches an nginx of its own per point, which is what makes
# `just reproduce` work on its own. For a sweep a long-living server is
# cheaper and stops the two fighting for spot quota:
#     scripts/bench/nginx-server.py start --client r6in.32xlarge
#     BENCH_ZONE=<its zone> just reproduce <this> --target-ip <its ip>
# with this set to "" so the point does not launch one as well.
server = "r6in.32xlarge"

[env]
BENCH_SCHEME    = "http"
BENCH_TLS_STUB  = "0"
AWS_BUCKET_SIZE = "50G"
BENCH_NOTE      = "miniOSv"
