name = "anyblob"
title = "AnyBlob's download manager against the same static nginx: throughput per core"
description = """
The AnyBlob arm of the bandwidth figure (Durner, Leis, Neumann, VLDB 2023): a
download manager built for this workload -- io_uring, shared submission queue,
one daemon per core -- so the per-core claim is not made against `wrk` alone.
No strawman: on raw TLS GETs from S3 it has beaten this stack outright, 94.9
against 83.5 Gbit/s at 8.4 busy cores against 16.

No client code was needed: main.cpp already took BENCH_URL and
BENCH_SCHEME=http. What was missing was the core budget, so `gro_off` and
`cap_cores` are lifted **verbatim** from competitors/wrk-http and the binary
runs under taskset -- two Linux arms shaped by one piece of code, or the axis
means a different thing on each. Depth is 64 a core, as the others.

One asymmetry stands: the other two send `Connection: close`, while AnyBlob
reuses connections through its ConnectionManager and has no knob for it (its
AnyBlob/ is a submodule). At 32 MiB a block the dial is well under a percent,
and it favours AnyBlob, so it is documented rather than removed.

A `server` type launches an nginx per point, which is what makes
`just reproduce` work alone. For a sweep use a long-living one instead:

    scripts/bench/nginx-server.py start --client r6in.32xlarge
    BENCH_ZONE=<its zone> just reproduce <this> --target-ip <its ip>

with `server` set to "" so the point does not launch its own.
"""

bench    = "competitors/anyblob"
instance = "r6in.32xlarge"
axis     = "cpus"
grid     = { cpus = [2, 4, 8, 16, 32] }
reps     = 2
cooldown = 0
max_vm_seconds = 900

value_col = "gbps"
ylabel    = "Gbps (payload, whole run)"
unit      = "Gbps"
series    = "note"

[fixed]
conns  = 64
blocks = 256
block  = "32M"
scheme = "http"
mode   = "nogro"
url    = "http://HOST/blob.bin"
server = "r6in.32xlarge"

[env]
AWS_BUCKET_SIZE = "50G"
BENCH_NOTE      = "Linux + AnyBlob"
