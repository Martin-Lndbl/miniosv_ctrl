name = "linux"
title = "wrk on Linux against a static nginx: the Linux half of the nginx head-to-head"
description = """
The `wrk` arm of the bandwidth figure: a conventional HTTP load generator,
against the same nginx, same wire.

Confined to the core budget -- irqbalance off, N channels, IRQs and XPS on
cores 0..N-1 -- and run `nogro` with the MTU left at 9001, so one IP datagram
is one wire frame on every arm and none is credited with another's header
overhead. `conns_per_cpu = 64` scales depth with the axis: a fixed total gave
wrk 16x the unikernel's depth at 2 cores, deep enough that 14 requests timed
out and the point was void.

A `server` type launches an nginx per point, which is what makes
`just reproduce` work alone. For a sweep use a long-living one instead:

    scripts/bench/nginx-server.py start --client r6in.32xlarge
    BENCH_ZONE=<its zone> just reproduce <this> --target-ip <its ip>

with `server` set to "" so the point does not launch its own.
"""

bench    = "competitors/wrk-http"
instance = "r6in.32xlarge"
axis     = "cpus"
grid     = { cpus = [2, 4, 8, 16, 32] }
reps     = 2
cooldown = 0
max_vm_seconds = 900

[fixed]
threads       = 32
conns_per_cpu = 64
block    = "32M"
close    = "1"
duration = 30
mode     = "nogro"
# A type here launches an nginx of its own per point, which is what makes
# `just reproduce` work on its own. For a sweep a long-living server is
# cheaper and stops the two fighting for spot quota:
#     scripts/bench/nginx-server.py start --client r6in.32xlarge
#     BENCH_ZONE=<its zone> just reproduce <this> --target-ip <its ip>
# with this set to "" so the point does not launch one as well.
server   = "r6in.32xlarge"

[env]
AWS_BUCKET_SIZE = "50G"
BENCH_NOTE      = "Linux"
