name = "miniosv-sf100-query-16xl"
title = "DuckDB-on-miniOSv: all 22 TPC-H queries at sf=100 on c6in.16xlarge"
description = """
The full suite at sf=100 on the 64-vCPU instance (100 Gbps, 128 GiB), the
miniOSv arm of the comparison with linux-sf100-query-16xl-parity. 256 DuckDB
threads on both arms: the sf=100 Q01 thread sweep on this instance
(miniosv-sf100-q1-threads-16xl, linux-sf100-q1-threads-16xl) put 256 ahead of
192 and 128 on both, 3.4 s against 3.5-4.2 and 5.1-5.2 on miniOSv.

Only Q01 and Q06 had run at sf=100 before this suite, so keep_going: a query
that fails or hits the 900 s cap is one invalid row, not the end of the sweep.
sf=100 has no canned answers, so `match` reads unchecked; correctness rests
on the sf=1 suite.

8 workers x 32 connections, not the 4 x 64 the first pass ran: with TLB
flushes coalesced and the response buffer kept per thread, the heavy joins
are worker-bound (Q08 7.3 s at 8 workers against 8.8 s at 4 and 7.8 s at
16), where before the fix every worker count landed on the same shootdown
mutex (Q08 21.5 s at 4, 22.1 s at 8, 24.1 s at 16).

    just plot results/tpch/miniosv-sf100-query-16xl.csv results/tpch/linux-sf100-query-16xl-parity.csv \\
        --series note --box --value-col query_ms --ylabel "Query latency (ms)"

Each query runs three times in a row in one boot -- cold, heated, warm --
distinguished by `query_seq`. Turn 3 is the steady state; turn 1 is only
genuinely cold for Q01, because every TPC-H query reads overlapping lineitem
ranges and the first query of the boot warms them for the rest. The turn-1
numbers are recorded, not used.

Why they differ at all: on sf=1 the same query run twice, same connections,
same bytes, was 37% quicker the second time on miniOSv and 26% on Linux, and
the cause is S3's own first-byte time falling 42 -> 24 ms on objects it has
just served. DuckDB's caches are off (enable_external_file_cache=false, and
identical body_bytes across turns proves it); mininet's connection counters
are identical across turns too, so it is not connection warmth.

One boot for all 66 turns instead of one instance per query: spot, not
compute, is the binding constraint -- c6in.16xlarge scores 1 of 10 in every
AWS region -- and a whole rep is minutes of query time inside the vm cap.
"""
bench    = "apps/bench/duckdb-tpch"
instance = "c6in.16xlarge"
axis     = "query"
reps     = 3
cooldown = 0
max_vm_seconds = 1800
keep_going = true


value_col = "query_ms"
ylabel    = "Query latency (ms)"
unit      = "ms"
series    = "note"
box       = true

[[points]]
query = "1 1 1 2 2 2 3 3 3 4 4 4 5 5 5 6 6 6 7 7 7 8 8 8 9 9 9 10 10 10 11 11 11 12 12 12 13 13 13 14 14 14 15 15 15 16 16 16 17 17 17 18 18 18 19 19 19 20 20 20 21 21 21 22 22 22"

[fixed]
sf      = "100"
workers = 8
conns   = 32
threads = 256

[env]
BENCH_NOTE = "miniOSv"
