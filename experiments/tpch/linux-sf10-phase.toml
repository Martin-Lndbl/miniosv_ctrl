name = "linux-sf10-phase"
title = "DuckDB on Linux at receive parity: where a request's time goes, measured at the socket, sf=10, 64 threads"
description = """
The Linux half of the measured-split pair (2026-09-27): Q01, Q09 and Q18 at 64
threads. The profiled pass runs the stock DuckDB with
competitors/duckdb-linux/netphase LD_PRELOADed (netphase=1) and DuckDB's HTTP
log on (httplog=1) in the same run, so a request's life from the log splits
into S3's turnaround, the body on the wire and the client's rest, each measured
here rather than borrowed from the miniOSv arm. See miniosv-sf10-phase.
"""

bench    = "competitors/duckdb-linux"
instance = "c6in.8xlarge"
axis     = "query"
grid     = { query = [1, 9, 18] }
reps     = 3
cooldown = 0
max_vm_seconds = 900
keep_going = true

target_ip = ""

value_col = "query_ms"
ylabel    = "Query latency (ms)"
unit      = "ms"
series    = "note"
box       = true

[fixed]
sf     = "10"
pin    = ""
gro    = "off"
queues = "2"
threads = 64
httplog = "1"
netphase = "1"

[env]
BENCH_NOTE = "Linux"
