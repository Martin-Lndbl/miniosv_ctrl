name = "linux-sf100-phase"
title = "DuckDB on Linux at receive parity: a request's split measured at the socket, Q01 at sf=100"
description = """
The Linux half of the sf=100 measured-split pair. The profiled pass runs the
stock DuckDB with competitors/duckdb-linux/netphase LD_PRELOADed and DuckDB's
HTTP log on, so a request's life splits into S3's turnaround, the body on the
wire and the client's rest, each measured here rather than borrowed from the
miniOSv arm.

Receive parity to match the miniOSv arm's 8 workers: GRO off, 8 queues.

Two things this run is meant to establish, both open:

  - whether the machinery survives sf=100 at all. Q01 issues ~10900 requests
    against ~980 at sf=10, and both the HTTP log and the netphase shim stamp
    every one of them.
  - whether the bar is reliable. `http_profile_ms` -- the instrumented pass,
    which is what the breakdown uses as this arm's total -- is a *different*
    execution from `query_ms`. At sf=10 those two disagreed by -16% to +22%
    across three reps, so the difference is variance, not instrumentation
    cost, and the bar height inherits it.

See miniosv-sf100-phase; run the two --concurrent.
"""
bench    = "competitors/duckdb-linux"
instance = "c5n.18xlarge"
axis     = "query"
grid     = { query = [1] }
reps     = 3
cooldown = 0
max_vm_seconds = 900
keep_going = true

value_col = "query_ms"
ylabel    = "Query latency (ms)"
unit      = "ms"
series    = "note"
box       = true

[fixed]
sf       = "100"
gro      = "off"
queues   = "8"
threads  = 256
httplog  = "1"
netphase = "1"

[env]
BENCH_NOTE = "Linux"
