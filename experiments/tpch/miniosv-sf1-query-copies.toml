name = "miniosv-sf1-query-copies"
title = "DuckDB-on-miniOSv: the checked sf=1 queries, one rep, as a merge gate"
description = """
The same run as its namesake without the -copies suffix, from miniosv branch
rx-copies (the socket-ring copy removed) with the httpfs staging copy removed
in apps/miniduckdb and apps/miniduckdb-httpfs (2026-09-27). sf=1 checks the
answers; sf=10 gives the per-request split beside this morning's run.
"""

bench    = "apps/bench/duckdb-tpch"
instance = "c6in.2xlarge"
axis     = "query"
grid     = { query = [1, 3, 6, 10, 12] }
reps     = 1
cooldown = 0
max_vm_seconds = 300
keep_going = true


value_col = "query_ms"
ylabel    = "Query latency (ms)"
unit      = "ms"
series    = "note"
box       = true

[fixed]
sf      = "1"
workers = 2
conns   = 64

[env]
BENCH_NOTE = "miniOSv, copies 2+5 out"
