name = "miniosv-sf10-phase"
title = "DuckDB-on-miniOSv: where a request's time goes, three queries, sf=10, 64 threads"
description = """
The miniOSv half of the measured-split pair (2026-09-27): Q01, Q09 and Q18 at
64 threads, with the per-request stats the arm always records. The Linux half,
linux-sf10-phase, now measures the same split at the socket instead of
borrowing S3's share from this arm. Run the two together:

    just queue miniosv-sf10-phase linux-sf10-phase --concurrent
    just breakdown results/tpch/miniosv-sf10-phase.csv \
        --linux results/tpch/linux-sf10-phase.csv --out results/tpch/sf10-phase.png \
        --title "TPC-H sf=10, c6in.8xlarge, 64 threads: where a request's time goes, both stacks measured"
"""

bench    = "apps/bench/duckdb-tpch"
instance = "c6in.8xlarge"
axis     = "query"
grid     = { query = [1, 9, 18] }
reps     = 3
cooldown = 0
max_vm_seconds = 900
keep_going = true

target_ip = ""

value_col = "query_ms"
ylabel    = "Query latency (ms)"
unit      = "ms"
series    = "note"
box       = true

[fixed]
sf      = "10"
workers = 2
conns   = 64
threads = 64

[env]
BENCH_NOTE = "miniOSv"
