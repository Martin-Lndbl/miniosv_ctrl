name = "linux-sf100-query-16xl-rerun"
title = "DuckDB on Linux: third rep of the sf=100 queries whose two reps disagreed"
description = """
A third rep of the eleven queries whose two Linux reps differed by more than
25% (Q03, Q05, Q06, Q10, Q11, Q13, Q16, Q18, Q19, Q20, Q22); miniOSv's reps
agreed within 13% everywhere but runs the same eleven, interleaved, so both
arms see the same S3 window. Same knobs as the suite; rows merge into the
suite CSVs.
"""
bench    = "competitors/duckdb-linux"
instance = "c6in.16xlarge"
axis     = "query"
grid     = { query = [3, 5, 6, 10, 11, 13, 16, 18, 19, 20, 22] }
reps     = 1
cooldown = 0
max_vm_seconds = 900
keep_going = true

target_ip = ""

value_col = "query_ms"
ylabel    = "Query latency (ms)"
unit      = "ms"
series    = "note"
box       = true

[fixed]
sf      = "100"
pin     = ""
threads = 256

[env]
BENCH_NOTE = "Linux"
