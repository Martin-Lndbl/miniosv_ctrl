name = "linux-tls-stock"
title = "Linux (stock): GET throughput vs concurrent connections per worker"
description = "As-shipped AL2023. Much of the range is EC2-allowance-shaped rather than stack-limited; where the flag clears is the result."

bench    = "competitors/linux-s3"
instance = "c6in.8xlarge"
axis     = "conns"
reps     = 3
cooldown = 120
max_vm_seconds = 900
out      = "results/conns/linux/tls-stock.csv"
keep_going = true       # an allowance-shaped point is a result, not a stop

# Resolved once for the whole experiment; S3 front-ends differ ~1.7x.
target_ip = ""

[fixed]
mode = "stock"
workers = 8
block   = "128M"

[env]
BENCH_TLS_STUB  = "0"
AWS_BUCKET_SIZE = "10G"

[[points]]
conns = 48
[[points]]
conns = 32
[[points]]
conns = 24
[[points]]
conns = 16
[[points]]
conns = 12
[[points]]
conns = 8
[[points]]
conns = 6
[[points]]
conns = 4
[[points]]
conns = 3
[[points]]
conns = 2
[[points]]
conns = 1
