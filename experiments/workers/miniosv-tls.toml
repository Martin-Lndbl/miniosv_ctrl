name = "miniosv-tls"
title = "GET throughput vs worker threads at constant offered load"
description = "Does the stack parallelise across RSS queues?"

bench    = "apps/bench/smoltcp-s3"
instance = "c6in.8xlarge"
axis     = "workers"
reps     = 3
cooldown = 0
max_vm_seconds = 110    # measured: 1 worker moves 16 GiB in ~28 s
out      = "results/workers/miniosv/tls.csv"

# Blank resolves once for the whole experiment. S3 front-ends do not perform
# alike: 29-30 Gbps on 3.5.217.210 vs 18 on 16.12.9.50, same configuration. Pin
# one to repeat against it -- S3 rotates them, so a stale value fails the build.
target_ip = ""

[fixed]
block = "128M"

[env]
BENCH_TLS_STUB  = "0"
AWS_BUCKET_SIZE = "10G"

# conns = 128 / workers, so total connections stay at 128 throughout. The axis
# stops at 8 because c6in.8xlarge advertises 8 RSS queues; asking for more just
# clamps and produces duplicate points.
[[points]]
workers = 1
conns   = 128
[[points]]
workers = 2
conns   = 64
[[points]]
workers = 4
conns   = 32
[[points]]
workers = 8
conns   = 16
