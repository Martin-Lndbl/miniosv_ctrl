name = "sf10-queues"
title = "Does mininet want more than 2 RSS queues on a 32-vCPU box? (no)"
description = """
The NIC offers more queues than we take, and nothing was clamping: the 2 comes
from `auto_workers()` (cpus/16) and from every benchmark pinning workers=2.
So the question is whether the device's spare queues are being left on the
table, and the answer is that they are not worth taking.

conns is per worker and held fixed at 16, so "more queues" means what it would
mean in production: more workers at the same per-worker config. The slot
ceiling scales with the axis -- 32, 64, 128 -- and DuckDB's pool shrinks the
other way, 30 / 28 / 24, because a worker spins without yielding and owns its
cpu, and reserved cpus now report offline. That trade is the measurement, not
a flaw in it.

Q06, sf=10, c6in.8xlarge, 2 reps, one pinned S3 front-end:

    workers  slots  threads   Q06 mean
    2         32     30       2678 ms   [2789, 2568]
    4         64     28       2555 ms   [2622, 2488]
    8        128     24       2977 ms   [2931, 3024]

2 and 4 are indistinguishable -- the ranges overlap, 2568 against 2622 -- and
8 is genuinely worse, every rep above every rep of the other two. requests is
1974 in all six runs, so it is the same work each time. Quadrupling the slot
ceiling twice buys nothing while each worker permanently costs a cpu, which is
what a latency-bound workload should do.

Two things this cannot say. in-flight depth is absent: http_concurrency comes
from DuckDB's HTTP log, which only exists on the instrumented branch, so
"slots were never the constraint" is inferred from the timings rather than
measured -- run it on perf/ring-crypto-provider to see the depth itself. And
`auto_workers()` documents its choice as "2 -> 4 cost ~10% and bought no
depth"; here 4 was marginally faster, so that number is not reproduced. The
earlier run pinned threads=96 and used a different front-end, so it is not a
contradiction, but the comment states a figure this run does not support.

The untested axis is conns at workers=2: more sockets per worker is free where
another worker costs a whole cpu.
"""

bench    = "apps/bench/duckdb-tpch"
instance = "c6in.8xlarge"
axis     = "workers"
reps     = 2
cooldown = 0
max_vm_seconds = 900

target_ip = "3.5.216.98"

value_col = "query_ms"
ylabel    = "Q06 latency (ms)"
unit      = "ms"
series    = "note"

[fixed]
sf      = "10"
query   = 6

[env]
BENCH_NOTE = "miniOSv"

# conns is per worker and held fixed, so the slot ceiling scales with the
# axis: 32, 64, 128. DuckDB's pool shrinks the other way -- 30, 28, 24 usable
# cpus -- which is the trade being measured, not a flaw in it.
[[points]]
workers = 2
conns   = 16

[[points]]
workers = 4
conns   = 16

[[points]]
workers = 8
conns   = 16
