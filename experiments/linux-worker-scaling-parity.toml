name = "linux-worker-scaling-parity"
title = "Linux (parity): GET throughput vs worker threads at constant offered load"
description = "Matched to smoltcp, conns = 128/workers. IRQs are confined to 8 cores, so past 8 workers the threads share them."

bench    = "competitors/linux-s3"
instance = "c6in.8xlarge"
axis     = "workers"
reps     = 3
cooldown = 120
max_vm_seconds = 900
out      = "results/linux-s3/workers-parity.csv"
keep_going = true       # an allowance-shaped point is a result, not a stop

# Resolved once for the whole experiment; S3 front-ends differ ~1.7x.
target_ip = ""

[fixed]
mode = "parity"
block = "128M"

[env]
BENCH_TLS_STUB  = "0"
AWS_BUCKET_SIZE = "10G"

# conns = 128/workers, so total connections stay at 128.
[[points]]
workers = 1
conns   = 128
[[points]]
workers = 2
conns   = 64
[[points]]
workers = 4
conns   = 32
[[points]]
workers = 8
conns   = 16
