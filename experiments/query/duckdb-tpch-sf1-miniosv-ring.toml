name = "duckdb-tpch-sf1-miniosv-ring"
title = "DuckDB-on-miniOSv with ring's AES-GCM: TPC-H sf=1, Q01 and Q03"
description = """
Does the crypto swap show up in the application, not just in the GET
benchmark? Same instance, scale factor, worker count and queries as
experiments/query/duckdb-tpch-sf1-miniosv.toml, so the rows overlay on
results/query/miniosv/tpch-sf1-c6in2xl.csv directly.

One rep, and only the two queries that baseline has clean rows for (Q01, a
full-table aggregate, and Q03, a join). One rep is enough to see a change of
the size the GET benchmark showed (+41%) and too few to call a small one --
read a modest delta here as "no contradiction", not as a measurement. The
baseline spread says as much: Q01 is 892-1227 ms across its three reps.

`match` is still checked: sf=1 is the scale the tpch extension ships answers
for, so a run that returns the wrong rows fails rather than being timed.
"""

bench    = "apps/bench/duckdb-tpch"
instance = "c6in.2xlarge"
axis     = "query"
reps     = 1
cooldown = 0
max_vm_seconds = 300
out      = "results/query/miniosv/tpch-sf1-c6in2xl-ring.csv"

target_ip = ""

value_col = "query_ms"
ylabel    = "Query latency (ms)"
unit      = "ms"
series    = "note"

[fixed]
sf      = "1"
workers = 2
conns   = 16

[env]
BENCH_NOTE = "miniOSv+ring"

[[points]]
query = 1
[[points]]
query = 3
