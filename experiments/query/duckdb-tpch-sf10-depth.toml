name = "duckdb-tpch-sf10-depth"
title = "DuckDB-on-miniOSv: how far in-flight depth scales, against Linux doing the same"
description = """
Once the thread-placement fix (miniosv da632237e) took the compute stage off
the critical path, Q06 at sf=10 became purely request-bound:

    requests x latency / concurrency = 1956 x 26.2 / 38.65 = 1324 ms
    measured                                                  1329 ms

so the only lever left is depth, and depth is set by DuckDB's thread count
(the slot ceiling, workers x conns, is not what binds). This sweep raises it
on both arms -- `threads` exists on the Linux arm precisely so this comparison
is symmetric -- and reports what each stack does with it.

Q06 sf=10, c6in.8xlarge, 2 reps, miniOSv at conns=48/worker (96 slots):

    thr  arm       reps (ms)        median  concurrency  p99 (ms)
    64   miniOSv   1065/1055          1060  45/46        39/38
    64   Linux     1593/1303          1448  38/53        1599/308
    96   miniOSv   1045/974           1009  47/50        38/39
    96   Linux     1179/1095          1137  80/78        442/358

Two things in that table matter more than the medians.

**miniOSv's p99 is flat at 38-39 ms at every depth.** Linux's runs 308-1599 ms
and grows with depth. So miniOSv reaches 1009 ms at concurrency ~50 while
Linux needs ~80 to reach 1137: it is getting there on per-request latency
rather than on depth, and the tail is the difference. That is a property of
the two request paths, not of the tuning, and it is why the gap *widens* at
matched thread counts (1.37x at 64) rather than narrowing.

**miniOSv's concurrency saturates near 50** whatever the thread count -- 45 at
64 threads, 47-50 at 96. The slot ceiling is 96, so slots are not it; at 96
threads only half of them are blocked in HTTP, which means the other half are
computing. That is the parallelism deficit that remains after the placement
fix (13.5 of 32 against Linux's 22.4), and closing it is what would push depth
toward 70 and Q06 toward ~700 ms.

Run both and overlay:

    just plot results/query/miniosv/tpch-sf10-depth.csv \\
              results/query/linux/tpch-sf10-depth.csv \\
        --series note --value-col query_ms --ylabel "Q06 latency (ms)"

Q06 rather than Q01 because it is the most request-heavy of the five (1956
ranges against Q01's 978), so it shows a depth change most clearly. Oversubscribing
threads is worth ~1.3x to both stacks and is not a miniOSv-only trick.
"""

bench    = "apps/bench/duckdb-tpch"
instance = "c6in.8xlarge"
axis     = "threads"
reps     = 2
cooldown = 0
max_vm_seconds = 900
out      = "results/query/miniosv/tpch-sf10-depth.csv"

target_ip = ""

value_col = "query_ms"
ylabel    = "Q06 latency (ms)"
unit      = "ms"
series    = "note"

[fixed]
sf      = "10"
query   = 6
workers = 2
conns   = 48
httplog = "1"

[env]
BENCH_NOTE = "miniOSv"

[[points]]
threads = 48
[[points]]
threads = 64
[[points]]
threads = 96
