name = "miniosv-tls"
title = "GET throughput vs concurrent connections per worker"
description = "Where do more concurrent connections stop increasing throughput?"

bench    = "apps/bench/smoltcp-s3"
instance = "c6in.8xlarge"
axis     = "conns"
grid     = { conns = [48, 32, 24, 16, 12, 8, 6, 4, 3, 2, 1] }
reps     = 3
cooldown = 0
max_vm_seconds = 110

# Blank resolves once for the whole experiment. S3 front-ends do not perform
# alike: 29-30 Gbps on 3.5.217.210 vs 18 on 16.12.9.50, same configuration. Pin
# one to repeat against it -- S3 rotates them, so a stale value fails the build.
target_ip = ""

# Held constant at every point.
[fixed]
workers = 8
block   = "128M"        # per request; one request per connection

# Compiled into the guest, so they change what the numbers mean. TLS_STUB=0
# decrypts through rustls and asserts byte-exactness; =1 discards ciphertext
# and measured 44.3 vs 33.1 Gbps at 48 conns, which is not the same experiment.
[env]
BENCH_TLS_STUB  = "0"
AWS_BUCKET_SIZE = "10G"
