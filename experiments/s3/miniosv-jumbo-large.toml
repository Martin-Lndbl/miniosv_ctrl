name = "miniosv-jumbo-large"
title = "Jumbo frames: does S3 send miniOSv frames larger than 1514 once the NIC is told to?"
description = """
The bring-up run for jumbo, deliberately on the smallest box that has a real
ENA so it costs cents.

miniOSv was stuck at 1500-byte payloads because `kMaxDataLen` in
minidpdk's slab.hh was a constexpr 1536, so the mbuf could not hold a jumbo
frame and `rte_pktmbuf_pool_create` asserted. Three constants now carry 9001
(slab's data room, the pool's DATA_ROOM_SIZE, smoltcp's frame size) and the
NIC is told about it: `mtu_set` existed on the ENA device but was never
called, so the device stayed at its power-on 1500 and would have dropped
every jumbo frame the stack asked for.

The instrument is `nic rx frame`: the NIC's own ibytes/ipackets. At MTU 1500
no frame can exceed 1514, so **any average above 1514 is jumbo arriving**.
Linux measured 7115 B/datagram against the same S3 with GRO off, so that is
roughly the number to expect; ~1460 means the MSS never got through.

Not a performance run: c6in.large bursts to 25 Gbps and 2 mininet workers can
already saturate that at 1500, so throughput here measures the burst line.
Correctness only.
"""

bench    = "apps/bench/smoltcp-s3"
instance = "c6in.large"
axis     = "conns"
grid     = { conns = [16] }
reps     = 1
cooldown = 0
max_vm_seconds = 600

[fixed]
# c6in.large is 2 vCPU; ENA grants queues to match, and clamp_queues trims
# anything larger. 2 x 16 x 128 MiB = 4 GiB.
workers = 2
block   = "128M"

[env]
BENCH_SCHEME    = "http"
BENCH_TLS_STUB  = "0"
AWS_BUCKET_SIZE = "50G"
BENCH_NOTE      = "miniOSv jumbo"
