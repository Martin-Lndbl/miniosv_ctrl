name = "linux-http-200g-capped"
title = "HTTP (no TLS): Linux (capped) GET throughput vs cores on a 200 Gbps machine"
description = """
The Linux arm of the 200 Gbps core sweep, at equal resources.

`capped` gives Linux the unikernel's core budget and nothing else: irqbalance
off, NIC channels set to the worker count, IRQs and XPS pinned to cores
0..N-1, one queue per worker with connections pinned to the core handling
them. It **keeps every Linux feature** -- jumbo frames at MTU 9001, GRO,
delayed ACK, receive-window autotuning.

That is the fairest single comparison to miniOSv, and the one to quote. It
equalises the resource the question is about -- cores, and the queues that
go with them -- while letting each stack use the techniques it actually has.
Linux keeping jumbo and GRO is not an unfair advantage; it is Linux. The
counterpart arm, linux-http-200g-parity, strips those to isolate the
per-packet path, and is a decomposition step rather than a verdict: turning
off a capability miniOSv lacks because minidpdk's mbuf data room is a
constexpr 1536 would be hiding our limitation rather than measuring theirs.

Identical shape to miniosv-http-200g -- same instance, same worker points,
64 connections a worker, 128 MiB a request, same bucket and blob -- so the
two curves are per-core comparable at every point. Read stock -> capped for
the cost of the core budget, capped -> parity for the value of jumbo and
GRO, and parity against miniOSv for the stacks alone.
"""

bench    = "competitors/linux-s3"
instance = "r6in.32xlarge"
axis     = "workers"
grid     = { workers = [8, 16, 24, 32] }
reps     = 1
cooldown = 0
max_vm_seconds = 900

[fixed]
conns = 64
block = "128M"
mode  = "capped"

[env]
BENCH_SCHEME    = "http"
BENCH_TLS_STUB  = "0"
AWS_BUCKET_SIZE = "50G"
BENCH_NOTE      = "Linux (capped)"
