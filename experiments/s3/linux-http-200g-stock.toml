name = "linux-http-200g-stock"
title = "HTTP (no TLS): Linux as shipped on a 200 Gbps machine -- and what one ENI can carry"
description = """
Two jobs at once, which is why it runs first.

**It settles what one ENI can carry.** miniOSv tops out at 153.9 Gbps
sustained on this box, and the single-NIC sweep showed why in one column:
ENA grants at most 32 queues per ENI, and 48 workers over those same 32
queues is slightly *worse* (145.4) than 32. What that does not say is
whether ~154 Gbps is the ENI, the instance, or us -- the rings are innocent
(TX never filled once across 191.5 M packets, RX missed 229 frames), so the
ceiling is somewhere else.

Linux answers it for free. Same instance, same single ENI, same bucket and
blob, a completely different stack with all 128 cores, jumbo frames and GRO.
If Linux also stalls near 154 Gbps the ceiling belongs to the ENI or the
instance and no amount of mininet work moves it; if Linux sails past, the
154 is ours. Either answer changes what the second-ENI run means, which is
why this goes before it.

**And it is the third mode of the comparison anyway.** stock is Linux as
anyone would actually deploy it -- nothing pinned, nothing turned off -- so
it is the bound the paper needs next to `capped` (equal cores, every Linux
feature kept) and `parity` (capped, minus jumbo/GRO/autotuning). Read
stock -> capped for the cost of the core budget, capped -> parity for what
jumbo and GRO are worth, and parity against miniOSv for the stacks alone.

Workers 16 / 32 / 48 / 64, swept to find where stock gets closest to the
wire. An earlier sweep reached 131.6 / 154.8 / 146.7 / 156.5 Gbps at
8 / 16 / 24 / 32 and was still rising at the end, so the peak may lie past
32 -- and since the question this arm answers is "what does Linux manage
when nothing is held back", it should be given the threads to answer it.

stock is not drawn as a curve. Its `workers` is the client's thread count
with all 128 cores behind it, so it does not share the other arms' x axis.
It is placed at the number of cpus it actually *used* -- cpu_s / elapsed,
measured from /proc/stat -- which is a figure the same axis can hold, and
is the honest way to ask "how many cores did Linux need for this".

64 connections a worker, 128 MiB a request, as everywhere else. `workers` is
the client's thread count; unlike capped and parity nothing restricts which
cores it lands on.
"""

bench    = "competitors/linux-s3"
instance = "r6in.32xlarge"
axis     = "workers"
grid     = { workers = [16, 32, 48, 64] }
reps     = 1
cooldown = 0
max_vm_seconds = 900

[fixed]
conns = 64
block = "128M"
mode  = "stock"

[env]
BENCH_SCHEME    = "http"
BENCH_TLS_STUB  = "0"
AWS_BUCKET_SIZE = "50G"
BENCH_NOTE      = "Linux (stock)"
