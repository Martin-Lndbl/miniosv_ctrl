name = "miniosv-tls-cpubound-base"
title = "TLS GET throughput where the worker is the bottleneck: 1 and 2 workers, before removing RX copies"
description = """
The A/B for the RX-copy removals of 2026-09-27 (miniosv branch rx-copies). At
8 workers c6in.8xlarge is NIC-bound near 40 Gbps and a copy fewer per byte
cannot show; at 1 and 2 workers the worker's cpu is the limit (9.9 and 18.0
Gbps on 2026-09-18), so a pass over the bytes saved is throughput gained. This
is the arm on kite/mininet as merged (969c647a6); miniosv-tls-cpubound-copy2
and -copy5 rerun it from the same front-end after each removal.
"""

bench    = "apps/bench/smoltcp-s3"
instance = "c6in.8xlarge"
axis     = "workers"
reps     = 3
cooldown = 0
max_vm_seconds = 300

target_ip = "3.5.217.123"   # pinned after the first reps resolved it; the arms share it

[fixed]
block = "128M"

[env]
BENCH_TLS_STUB  = "0"
AWS_BUCKET_SIZE = "10G"
BENCH_NOTE      = "miniOSv, base"

[[points]]
workers = 1
conns   = 128
[[points]]
workers = 2
conns   = 64
