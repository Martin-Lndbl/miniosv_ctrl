name = "linux-fe-jumbofe"
title = "Cross-check with Linux: what frame size does the S3 front-end 3.5.217.108 send? (MTU 9001, GRO off)"
description = """
Half of a pair (linux-fe-jumbofe / linux-fe-smallfe) that decides whether
"this front-end will not do jumbo" is a property of S3 or a bug in miniOSv.

miniOSv measured, 2026-09-29 on c6in.large: a worker pinned to a 3.5.216.0/22
front-end received 7962-byte frames and finished its 2 GiB in 2.2 s, while the
sibling worker on 52.95.169.76 received nothing over 1514 and took 4.4 s. Both
ranges are in the com.amazonaws.eu-north-1.s3 prefix list, so both go through
the gateway endpoint and neither is subject to the internet gateway's
documented 1500-byte cap.

Linux is the independent witness.  keeps the interface at 9001 and
turns GRO off, so one IP datagram is one wire frame and Ip:InReceives divided
into the bytes is the frame size directly. If Linux also sees ~1460 from
52.95.169.76 and ~7000+ from the 3.5 front-end, the difference is S3's and
miniOSv is innocent.
"""

bench    = "competitors/linux-s3"
instance = "c6in.large"
axis     = "workers"
grid     = { workers = [2] }
reps     = 1
cooldown = 0
max_vm_seconds = 900
target_ip = "3.5.217.108"

[fixed]
conns = 16
block = "128M"
mode  = "nogro"

[env]
BENCH_SCHEME    = "http"
BENCH_TLS_STUB  = "0"
AWS_BUCKET_SIZE = "50G"
BENCH_NOTE      = "Linux 9001/no-GRO vs 3.5.217.108"
