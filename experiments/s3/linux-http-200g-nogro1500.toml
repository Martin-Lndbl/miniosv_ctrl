name = "linux-http-200g-nogro1500"
title = "HTTP (no TLS): Linux at smoltcp's frame size, without the sysctls that cost more than jumbo"
description = """
The cell that was never measured, and without it the attribution of the
Linux-vs-Linux gap is guesswork.

What exists at 8 cores:

    capped      MTU 9001  GRO on   + nothing            136.9 Gbps
    nogro       MTU 9001  GRO off  + nothing            129.5 Gbps
    parity      MTU 1500  GRO off  + quickack, rmem,     23.2 Gbps
                                     busy poll

`nogro` isolated GRO cleanly: 9%. The 129.5 -> 23.2 step was then credited
to frame size, but parity changes **four** things at once and only one of
them is the MTU. This mode is capped minus GRO minus jumbo, keeping delayed
ACK, rmem autotuning and interrupt-driven receive, so one run answers both
halves: against `nogro` it prices frame size alone, and against `parity` it
prices the three sysctls parity also sets.

If it lands near 23, frame size is the whole story and minidpdk jumbo is
the top item. If it lands near 129, the collapse is one of the sysctls --
busy poll is the suspect, since spinning per socket across 512 sockets on
8 cores is a plausible way to lose 5x -- and jumbo is not the priority it
currently looks like.

**It answered: 60.3 Gbps at 8 cores.** So frame size is worth 2.15x
(129.5 -> 60.3) and the three sysctls are worth 2.6x (60.3 -> 23.2) -- the
settings meant to make Linux resemble smoltcp cost it more than losing
jumbo does, and `parity` is therefore not "Linux under smoltcp's
constraints" but Linux hobbled by configuration we imposed. busy_poll is
the suspect: a per-socket spin across 512 sockets on 8 cores.

This arm is what parity was meant to be, so it is swept 8-32 and takes
parity's place in the figure. At 8 cores it puts miniOSv (63.6) and Linux
(60.3) within 5% of each other at the same frame size, which is the honest
like-for-like and a far weaker claim than parity implied.
"""

bench    = "competitors/linux-s3"
instance = "r6in.32xlarge"
axis     = "workers"
grid     = { workers = [8, 16, 24, 32] }
reps     = 1
cooldown = 0
max_vm_seconds = 900

[fixed]
conns = 64
block = "128M"
mode  = "nogro1500"

[env]
BENCH_SCHEME    = "http"
BENCH_TLS_STUB  = "0"
AWS_BUCKET_SIZE = "50G"
BENCH_NOTE      = "Linux (GRO off, MTU 1500)"
