name = "wrk-nginx-2c-parity"
title = "wrk against a static nginx on two cores, on mininet's wire"
description = """
The Linux counterpart of miniosv-nginx-2w: 128 requests in flight (2 threads x
64 connections, as mininet's 2 workers x 64), 128 MiB ranged GETs, a connection
per block, against its own nginx in its own zone.

Two things are held to miniOSv's terms. The cpu budget: irqbalance off, two
NIC channels, IRQs and XPS on cores 0-1, and wrk itself under taskset, so no
softirq or user thread runs outside them -- two cores carry the whole receive
path, as two busy-polling workers do. And the wire: mode=parity drops the MTU
to 1500 and GRO off, because minidpdk's mbuf data room is a constexpr 1536 and
1500 is all miniOSv can offer. At 9001 with GRO the Linux client moved 9012
byte frames against miniOSv's 1514, six times fewer per byte, which a per-core
comparison would be measuring instead of the stacks.

wrk-nginx-2c is the same point with AL2023 as shipped: Linux at its best on
two cores, jumbo frames and all.

    just queue http/wrk-nginx-2c-parity,http/wrk-nginx-2c --concurrent
"""

bench    = "competitors/wrk-http"
instance = "c6in.8xlarge"
axis     = "cpus"
grid     = { cpus = [2] }
reps     = 1
cooldown = 0
max_vm_seconds = 600

target_ip = "server"

[fixed]
threads  = 2
conns    = 64
duration = 60
block    = "128M"
close    = "1"
mode     = "parity"
server   = "c6in.8xlarge"

[env]
AWS_BUCKET_SIZE = "10G"
BENCH_ZONES     = "eu-north-1c,eu-north-1b,eu-north-1a"
BENCH_NOTE      = "Linux, wrk, 2 cores, parity wire"
