name = "instance-scaling"
title = "GET throughput vs EC2 instance size, at each machine's queue count"
description = "How far does the stack ride the machine it is given?"

bench    = "apps/bench/smoltcp-s3"
instance = ""  # overridden per point; the axis is the machine
axis     = "instance"
reps     = 3
cooldown = 180
max_vm_seconds = 180
out      = "results/smoltcp-s3/sweep-instance.csv"

target_ip = ""

[fixed]
workers = 64
conns   = 16
block   = "128M"

[env]
BENCH_TLS_STUB  = "0"
AWS_BUCKET_SIZE = "10G"

# large through 4xlarge are burstable: baselines are 3.125/6.25/12.5/25 Gbps but
# they reach 25-50 on network credits, and a ~30 s run never leaves that window.
# Those four measure burst, not what the machine sustains. Only 8xlarge (50) and
# 16xlarge (100) are credit-free. Read the small end as an upper bound.
[[points]]
instance = "c6in.large"
[[points]]
instance = "c6in.xlarge"
[[points]]
instance = "c6in.2xlarge"
[[points]]
instance = "c6in.4xlarge"
[[points]]
instance = "c6in.8xlarge"
[[points]]
instance = "c6in.16xlarge"
